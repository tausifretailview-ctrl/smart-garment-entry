name: Schema migration drift

# Live bidirectional compare. Fail closed: missing credentials is an error,
# never a green skip. This job exists to catch "merged but not applied live"
# (dispatch_nightly_backups, 20260628120000, 20261025120000 / Bug A).

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  live-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Compare repo migrations to live schema_migrations
        env:
          # URL is not secret (also in .env). Default the production project when
          # the GitHub secret is unset so an empty SUPABASE_DRIFT_URL cannot skip
          # the compare. The service-role key and production-allow flag remain required.
          SUPABASE_DRIFT_URL: ${{ secrets.SUPABASE_DRIFT_URL }}
          SUPABASE_DRIFT_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DRIFT_SERVICE_ROLE_KEY }}
          ALLOW_PRODUCTION_DRIFT_CHECK: ${{ secrets.ALLOW_PRODUCTION_DRIFT_CHECK }}
        run: |
          set -eu
          if [ -z "${SUPABASE_DRIFT_URL}" ]; then
            SUPABASE_DRIFT_URL="https://lkbbrqcsbhqjvsxiorvp.supabase.co"
            export SUPABASE_DRIFT_URL
            echo "SUPABASE_DRIFT_URL secret unset — using production project URL."
          fi
          echo "Live compare URL host: $(node -e 'try { console.log(new URL(process.env.SUPABASE_DRIFT_URL).host) } catch { console.log("invalid-url") }')"
          if [ -z "${SUPABASE_DRIFT_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_DRIFT_SERVICE_ROLE_KEY is empty. Set it from Lovable Cloud → Supabase project → service_role key (Settings → Secrets and variables → Actions). Also set ALLOW_PRODUCTION_DRIFT_CHECK=1 because this URL is production."
            exit 1
          fi
          if [ -z "${ALLOW_PRODUCTION_DRIFT_CHECK}" ]; then
            echo "::warning::ALLOW_PRODUCTION_DRIFT_CHECK is empty. Production URLs are refused unless this secret is the literal 1."
          fi
          npm run check:schema-drift:live
