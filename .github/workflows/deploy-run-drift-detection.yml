name: Deploy run-drift-detection

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: lkbbrqcsbhqjvsxiorvp
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy run-drift-detection
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is not configured"
            exit 1
          fi
          supabase functions deploy run-drift-detection --project-ref "$PROJECT_ID" --use-api

      - name: Verify unauthorized call returns 403
        run: |
          resp=$(curl -s -w "\n%{http_code}" -X POST \
            "https://${PROJECT_ID}.supabase.co/functions/v1/run-drift-detection" \
            -H "Content-Type: application/json" -d '{}')
          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          test "$code" = "403"
